<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StringX — 20s Launch Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0e0517;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    /* Video Player Container */
    .player-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 100%;
    }

    .video-stage-container {
      position: relative;
      background: #1B0B2A;
      border-radius: 28px;
      box-shadow: 0 25px 60px -15px rgba(240, 42, 138, 0.3), 0 0 0 3px #251436;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Aspect Ratio Modes */
    .mode-vertical {
      width: 380px;
      height: 675px; /* 9:16 */
    }

    .mode-landscape {
      width: 854px;
      height: 480px; /* 16:9 */
    }

    #videoCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #251436;
    }

    /* Control Bar */
    .controls-panel {
      background: rgba(37, 20, 54, 0.85);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(227, 224, 245, 0.15);
      border-radius: 20px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-label {
      font-size: 13px;
      font-weight: 700;
      color: #FFC928;
      font-variant-numeric: tabular-nums;
      min-width: 85px;
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #894EFF, #F02A8A, #FFC928);
      border-radius: 999px;
      transition: width 0.05s linear;
    }

    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: #894EFF;
      color: #ffffff;
      border: 2px solid #251436;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-shadow: 2px 2px 0px #251436;
    }

    .btn:hover {
      background: #9d69ff;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 0 0;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-accent {
      background: #F02A8A;
    }
    .btn-accent:hover {
      background: #ff439d;
    }

    .btn-gold {
      background: #FFC928;
      color: #251436;
    }
    .btn-gold:hover {
      background: #ffd555;
    }

    /* Scene Indicator Pills */
    .scene-badges {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .scene-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .scene-pill.active {
      background: #F02A8A;
      color: #ffffff;
      border-color: #FFC928;
      box-shadow: 0 0 10px rgba(240, 42, 138, 0.5);
    }

    /* Top Branding Bar */
    .header-bar {
      margin-bottom: 12px;
      text-align: center;
    }

    .header-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 30%, #FFC928 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-subtitle {
      font-size: 12px;
      color: #D4CEEF;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">STRING X • 20s Launch Reel</div>
    <div class="header-subtitle">Campus Garba Partner Matching for Navratri</div>
  </div>

  <div class="player-wrapper">
    <!-- Video Stage Canvas -->
    <div class="video-stage-container mode-vertical" id="stageContainer">
      <canvas id="videoCanvas" width="1080" height="1920"></canvas>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <!-- Scene Navigation -->
      <div class="scene-badges" id="sceneBadges">
        <div class="scene-pill active" onclick="seekTo(0.0)">1. Discover</div>
        <div class="scene-pill" onclick="seekTo(3.2)">2. Profile</div>
        <div class="scene-pill" onclick="seekTo(6.8)">3. Matching</div>
        <div class="scene-pill" onclick="seekTo(10.4)">4. Silk String</div>
        <div class="scene-pill" onclick="seekTo(14.2)">5. Countdown</div>
        <div class="scene-pill" onclick="seekTo(17.0)">6. Reveal</div>
      </div>

      <!-- Scrubber -->
      <div class="timeline-row">
        <span class="time-label" id="timeDisplay">00:00 / 00:20</span>
        <div class="progress-bar-container" id="progressBar">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="buttons-row">
        <div class="btn-group">
          <button class="btn btn-accent" id="playBtn" onclick="togglePlay()">
            <span id="playIcon">▶</span> <span id="playText">Play</span>
          </button>
          <button class="btn btn-secondary" onclick="restartVideo()">↺ Replay</button>
          <button class="btn btn-secondary" id="audioBtn" onclick="toggleAudio()">🔊 Sound On</button>
        </div>

        <div class="btn-group">
          <button class="btn btn-secondary" onclick="toggleFormat()" id="formatBtn">📱 Vertical (9:16)</button>
          <button class="btn btn-gold" id="recordBtn" onclick="recordVideo()">📥 Export Video</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TOTAL_DURATION = 20.0; // 20.0 seconds
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const audioBtn = document.getElementById('audioBtn');
    const formatBtn = document.getElementById('formatBtn');
    const stageContainer = document.getElementById('stageContainer');
    const sceneBadges = document.querySelectorAll('.scene-pill');

    let currentTime = 0.0;
    let isPlaying = false;
    let isLandscape = false;
    let audioEnabled = true;
    let lastFrameTime = performance.now();
    let audioCtx = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Particles system
    const particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * 1080,
      y: Math.random() * 1920,
      radius: Math.random() * 4 + 1.5,
      vx: (Math.random() - 0.5) * 0.8,
      vy: (Math.random() - 0.5) * 0.8 - 0.5,
      color: ['#FFC928', '#F02A8A', '#894EFF', '#08A98D', '#FFFFFF'][Math.floor(Math.random() * 5)],
      alpha: Math.random() * 0.8 + 0.2,
      pulseSpeed: Math.random() * 2 + 1
    }));

    // Confetti system for Scene 6
    const confettiPieces = Array.from({ length: 120 }, () => ({
      x: Math.random() * 1080,
      y: Math.random() * 600 - 300,
      w: Math.random() * 16 + 8,
      h: Math.random() * 12 + 6,
      vx: (Math.random() - 0.5) * 12,
      vy: Math.random() * 15 + 8,
      rotation: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 15,
      color: ['#FFC928', '#F02A8A', '#894EFF', '#08A98D', '#FFFFFF'][Math.floor(Math.random() * 5)]
    }));

    // Web Audio Synthesizer for Festival Beats
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.2, gainLevel = 0.3) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLevel, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // Beat triggers
    let lastBeat = -1;
    function processAudioBeats(t) {
      if (!audioEnabled || !audioCtx) return;
      const bpm = 128;
      const beatInterval = 60 / bpm;
      const currentBeat = Math.floor(t / beatInterval);

      if (currentBeat !== lastBeat) {
        lastBeat = currentBeat;
        // Festive Dhol/Kick pulse
        if (currentBeat % 2 === 0) {
          playTone(65, 'triangle', 0.18, 0.4); // Sub kick
        } else {
          playTone(220, 'square', 0.08, 0.15); // Snappy rim/dhol snap
        }

        // Countdown tension ticks (14.2s to 17.0s)
        if (t >= 14.0 && t < 17.0) {
          playTone(880, 'sine', 0.05, 0.25); // Clock tick
        }

        // Partner Reveal Drop Chime at 17.0s
        if (t >= 17.0 && t <= 17.2) {
          playTone(523.25, 'triangle', 0.8, 0.4); // High C
          setTimeout(() => playTone(659.25, 'triangle', 0.8, 0.4), 100); // E
          setTimeout(() => playTone(783.99, 'triangle', 1.2, 0.5), 200); // G celebratory chord
        }
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      audioBtn.innerText = audioEnabled ? '🔊 Sound On' : '🔇 Mute';
      if (audioEnabled) initAudio();
    }

    function toggleFormat() {
      isLandscape = !isLandscape;
      if (isLandscape) {
        canvas.width = 1920;
        canvas.height = 1080;
        stageContainer.className = 'video-stage-container mode-landscape';
        formatBtn.innerText = '🖥️ Landscape (16:9)';
      } else {
        canvas.width = 1080;
        canvas.height = 1920;
        stageContainer.className = 'video-stage-container mode-vertical';
        formatBtn.innerText = '📱 Vertical (9:16)';
      }
      render(currentTime);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        initAudio();
        if (currentTime >= TOTAL_DURATION) currentTime = 0;
        lastFrameTime = performance.now();
        playIcon.innerText = '⏸';
        playText.innerText = 'Pause';
        requestAnimationFrame(loop);
      } else {
        playIcon.innerText = '▶';
        playText.innerText = 'Play';
      }
    }

    function restartVideo() {
      currentTime = 0.0;
      lastBeat = -1;
      if (!isPlaying) togglePlay();
    }

    function seekTo(targetTime) {
      currentTime = Math.max(0, Math.min(TOTAL_DURATION, targetTime));
      lastBeat = Math.floor(currentTime / (60 / 128));
      render(currentTime);
      updateUI();
    }

    document.getElementById('progressBar').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const fraction = clickX / rect.width;
      seekTo(fraction * TOTAL_DURATION);
    });

    function updateUI() {
      const progress = (currentTime / TOTAL_DURATION) * 100;
      progressFill.style.width = progress + '%';
      const sec = Math.floor(currentTime);
      const ms = Math.floor((currentTime % 1) * 100);
      timeDisplay.innerText = `00:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')} / 00:20`;

      // Update active scene pill
      let activeSceneIndex = 0;
      if (currentTime >= 17.0) activeSceneIndex = 5;
      else if (currentTime >= 14.2) activeSceneIndex = 4;
      else if (currentTime >= 10.4) activeSceneIndex = 3;
      else if (currentTime >= 6.8) activeSceneIndex = 2;
      else if (currentTime >= 3.2) activeSceneIndex = 1;
      else activeSceneIndex = 0;

      sceneBadges.forEach((badge, idx) => {
        if (idx === activeSceneIndex) badge.classList.add('active');
        else badge.classList.remove('active');
      });
    }

    // --- DRAWING ENGINE ---

    function drawBackground(w, h, t) {
      // Atmospheric dark plum festival gradient
      const bgGrad = ctx.createRadialGradient(w/2, h * 0.45, 50, w/2, h/2, w * 0.9);
      bgGrad.addColorStop(0, '#361852');
      bgGrad.addColorStop(0.5, '#251436');
      bgGrad.addColorStop(1, '#13081e');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Festive glowing bokeh orbs
      const glow1X = w/2 + Math.sin(t * 1.5) * (w * 0.2);
      const glow1Y = h * 0.35 + Math.cos(t * 1.2) * (h * 0.1);
      const rad1 = ctx.createRadialGradient(glow1X, glow1Y, 10, glow1X, glow1Y, w * 0.4);
      rad1.addColorStop(0, 'rgba(240, 42, 138, 0.18)');
      rad1.addColorStop(1, 'rgba(240, 42, 138, 0)');
      ctx.fillStyle = rad1;
      ctx.fillRect(0, 0, w, h);

      const glow2X = w/2 - Math.cos(t * 1.3) * (w * 0.25);
      const glow2Y = h * 0.65 + Math.sin(t * 1.1) * (h * 0.1);
      const rad2 = ctx.createRadialGradient(glow2X, glow2Y, 10, glow2X, glow2Y, w * 0.45);
      rad2.addColorStop(0, 'rgba(255, 201, 40, 0.14)');
      rad2.addColorStop(1, 'rgba(255, 201, 40, 0)');
      ctx.fillStyle = rad2;
      ctx.fillRect(0, 0, w, h);

      // Floating dust particles
      particles.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        if (p.y < 0) p.y = h;
        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;

        const pulse = 0.5 + 0.5 * Math.sin(t * p.pulseSpeed);
        ctx.beginPath();
        ctx.arc(p.x * (w / 1080), p.y * (h / 1920), p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha * pulse;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // Festive fairy lights wire across top
      ctx.beginPath();
      ctx.moveTo(0, h * 0.04);
      ctx.quadraticCurveTo(w * 0.5, h * 0.08, w, h * 0.04);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Bulbs on the string
      const bulbCount = 9;
      const bulbColors = ['#FFC928', '#F02A8A', '#894EFF', '#08A98D', '#FFC928', '#F02A8A', '#894EFF', '#08A98D', '#FFC928'];
      for (let i = 0; i < bulbCount; i++) {
        const u = (i + 0.5) / bulbCount;
        const bx = u * w;
        const by = h * 0.04 + Math.sin(u * Math.PI) * (h * 0.04);
        const glow = 0.7 + 0.3 * Math.sin(t * 3 + i);

        ctx.beginPath();
        ctx.arc(bx, by, 7, 0, Math.PI * 2);
        ctx.fillStyle = bulbColors[i];
        ctx.shadowColor = bulbColors[i];
        ctx.shadowBlur = 15 * glow;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Neo-Brutalist Box helper
    function drawNeoCard(x, y, w, h, bgColor, radius = 24, strokeColor = '#251436', shadowOffset = 8) {
      ctx.save();
      // Drop Shadow
      ctx.beginPath();
      ctx.roundRect(x + shadowOffset, y + shadowOffset, w, h, radius);
      ctx.fillStyle = '#10051B';
      ctx.fill();

      // Main Box
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = strokeColor;
      ctx.stroke();
      ctx.restore();
    }

    // Badge helper
    function drawBadge(text, x, y, colorBg, colorText, angle = -0.05) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.font = '800 24px "Plus Jakarta Sans"';
      const textMetrics = ctx.measureText(text);
      const padX = 24;
      const padY = 12;
      const badgeW = textMetrics.width + padX * 2;
      const badgeH = 44;

      // Shadow
      ctx.fillStyle = '#251436';
      ctx.beginPath();
      ctx.roundRect(-badgeW/2 + 4, -badgeH/2 + 4, badgeW, badgeH, 12);
      ctx.fill();

      // Base
      ctx.fillStyle = colorBg;
      ctx.beginPath();
      ctx.roundRect(-badgeW/2, -badgeH/2, badgeW, badgeH, 12);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#251436';
      ctx.stroke();

      // Text
      ctx.fillStyle = colorText;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 2);
      ctx.restore();
    }

    // StringX Connected Logo Helper
    function drawStringXLogo(x, y, scale = 1, light = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.font = '900 64px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Drop glow
      ctx.shadowColor = '#F02A8A';
      ctx.shadowBlur = 25;

      ctx.fillStyle = light ? '#FFFFFF' : '#251436';
      ctx.fillText("STRING", -40, 0);

      ctx.fillStyle = '#F02A8A';
      ctx.fillText("X", 95, 0);

      ctx.shadowBlur = 0;

      // Golden connected silk loop under X
      ctx.beginPath();
      ctx.moveTo(70, 28);
      ctx.quadraticCurveTo(95, 45, 120, 28);
      ctx.strokeStyle = '#FFC928';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.restore();
    }

    // --- BEAT 1: DISCOVER STRINGX (0.0s - 3.2s) ---
    function renderBeat1(w, h, t) {
      const p = t / 3.2; // 0 to 1
      const entrance = Math.min(1, p * 2.5);
      const easeY = (1 - Math.pow(1 - entrance, 3));

      // Header Tagline
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 36px "Plus Jakarta Sans"';
      ctx.fillText("NAVRATRI 2026", w/2, h * 0.14);

      drawBadge("✨ FIND YOUR GARBA PERSON", w/2, h * 0.19, '#FFC928', '#251436', 0.03 * Math.sin(t * 4));

      // Floating Mobile Phone Frame
      const phoneW = isLandscape ? 360 : 640;
      const phoneH = isLandscape ? 680 : 1080;
      const phoneX = w/2 - phoneW/2;
      const phoneY = h * 0.25 + (1 - easeY) * 300 + Math.sin(t * 3) * 12;

      drawNeoCard(phoneX, phoneY, phoneW, phoneH, '#E3E0F5', 40, '#251436', 14);

      // Phone Screen Content: Landing Screen Mock
      ctx.save();
      ctx.translate(phoneX + phoneW/2, phoneY + 120);

      // Dandiya Sticks Crossed
      ctx.save();
      ctx.translate(0, 40);
      const stickRot = Math.sin(t * 4) * 0.15;
      // Stick 1
      ctx.rotate(-0.4 + stickRot);
      ctx.fillStyle = '#894EFF';
      ctx.fillRect(-15, -90, 30, 180);
      ctx.fillStyle = '#FFC928';
      ctx.fillRect(-15, -40, 30, 25);
      ctx.fillStyle = '#F02A8A';
      ctx.fillRect(-15, 10, 30, 25);
      ctx.rotate(0.4 - stickRot);

      // Stick 2
      ctx.rotate(0.4 - stickRot);
      ctx.fillStyle = '#F02A8A';
      ctx.fillRect(-15, -90, 30, 180);
      ctx.fillStyle = '#08A98D';
      ctx.fillRect(-15, -40, 30, 25);
      ctx.fillStyle = '#FFC928';
      ctx.fillRect(-15, 10, 30, 25);
      ctx.restore();

      // Logo in phone
      drawStringXLogo(0, 190, 0.9, false);

      // Sub-copy
      ctx.font = '700 24px "Plus Jakarta Sans"';
      ctx.fillStyle = '#251436';
      ctx.textAlign = 'center';
      ctx.fillText("College Garba Partner Matching", 0, 270);

      // CTA Button Mock
      ctx.beginPath();
      ctx.roundRect(-phoneW * 0.38, 340, phoneW * 0.76, 75, 20);
      ctx.fillStyle = '#894EFF';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#251436';
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 28px "Plus Jakarta Sans"';
      ctx.fillText("Find My Garba Person 🪩", 0, 388);

      ctx.restore();
      ctx.restore();
    }

    // --- BEAT 2: CREATE YOUR PROFILE (3.2s - 6.8s) ---
    function renderBeat2(w, h, t) {
      const relT = t - 3.2;
      const step = relT / 3.6;

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFC928';
      ctx.font = '800 32px "Plus Jakarta Sans"';
      ctx.fillText("STEP 01", w/2, h * 0.12);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 52px "Plus Jakarta Sans"';
      ctx.fillText("Craft Your Vibe", w/2, h * 0.16);

      const cardW = isLandscape ? 500 : 760;
      const cardH = isLandscape ? 550 : 880;
      const cardX = w/2 - cardW/2;
      const cardY = h * 0.22;

      drawNeoCard(cardX, cardY, cardW, cardH, '#FFFFFF', 36, '#251436', 12);

      // Profile Content
      ctx.save();
      ctx.translate(cardX, cardY);

      // Avatar Circle with Neon Border
      ctx.beginPath();
      ctx.arc(cardW/2, 130, 80, 0, Math.PI * 2);
      ctx.fillStyle = '#E3E0F5';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#F02A8A';
      ctx.stroke();

      // Avatar illustration (female dancer silhouette)
      ctx.font = '72px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText("💃", cardW/2, 155);

      // Name & Age
      ctx.font = '900 38px "Plus Jakarta Sans"';
      ctx.fillStyle = '#251436';
      ctx.fillText("Aanya Sharma, 20", cardW/2, 260);

      // Campus Badge
      drawBadge("🎓 BITS Pilani • 3rd Year", cardW/2, 310, '#D4CEEF', '#251436', 0);

      // Staggered Skill Pills
      if (relT > 0.6) {
        const bounce1 = Math.min(1, (relT - 0.6) * 4);
        ctx.save();
        ctx.translate(cardW * 0.3, 410);
        ctx.scale(bounce1, bounce1);
        drawBadge("🔥 Garba Skill: Pro", 0, 0, '#F02A8A', '#FFFFFF', -0.05);
        ctx.restore();
      }

      if (relT > 1.2) {
        const bounce2 = Math.min(1, (relT - 1.2) * 4);
        ctx.save();
        ctx.translate(cardW * 0.7, 410);
        ctx.scale(bounce2, bounce2);
        drawBadge("⚡ Energy: 4 AM Nonstop", 0, 0, '#FFC928', '#251436', 0.04);
        ctx.restore();
      }

      // 1 AM Prompt Box
      if (relT > 1.8) {
        const bounce3 = Math.min(1, (relT - 1.8) * 3);
        ctx.save();
        ctx.translate(cardW/2, 530);
        ctx.scale(bounce3, bounce3);

        const promptW = cardW * 0.85;
        ctx.fillStyle = '#FFF9E6';
        ctx.beginPath();
        ctx.roundRect(-promptW/2, 0, promptW, 110, 16);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#251436';
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = '800 18px "Plus Jakarta Sans"';
        ctx.fillStyle = '#894EFF';
        ctx.fillText("MY 1 AM GARBA TRADITION:", -promptW/2 + 20, 35);

        ctx.font = '700 22px "Plus Jakarta Sans"';
        ctx.fillStyle = '#251436';
        ctx.fillText('"Chai & Maska Bun at tapri post Garba"', -promptW/2 + 20, 75);
        ctx.restore();
      }

      // Verification Pill
      if (relT > 2.5) {
        drawBadge("✓ Face & College Verified", cardW/2, 690, '#08A98D', '#FFFFFF', 0);
      }

      ctx.restore();
      ctx.restore();
    }

    // --- BEAT 3: FIND YOUR GARBA PARTNER (6.8s - 10.4s) ---
    function renderBeat3(w, h, t) {
      const relT = t - 6.8;

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFC928';
      ctx.font = '800 32px "Plus Jakarta Sans"';
      ctx.fillText("STEP 02", w/2, h * 0.12);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 52px "Plus Jakarta Sans"';
      ctx.fillText("Curated Campus Pairing", w/2, h * 0.16);

      // Radar scanning rings in center
      const centerX = w/2;
      const centerY = h * 0.52;
      const scanRadius = (relT * 220) % (w * 0.45);

      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, scanRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(240, 42, 138, 0.4)';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(centerX, centerY, scanRadius * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 201, 40, 0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // Twin Cards: Left User (Aanya) & Right User (Rohan)
      const miniW = isLandscape ? 300 : 360;
      const miniH = isLandscape ? 440 : 560;

      // Card 1: Left
      const card1X = w * 0.26 - miniW/2;
      const card1Y = h * 0.28;
      drawNeoCard(card1X, card1Y, miniW, miniH, '#FFFFFF', 28, '#251436', 8);

      ctx.save();
      ctx.translate(card1X + miniW/2, card1Y + 70);
      ctx.font = '54px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText("💃", 0, 0);
      ctx.font = '900 26px "Plus Jakarta Sans"';
      ctx.fillStyle = '#251436';
      ctx.fillText("Aanya", 0, 60);
      ctx.font = '700 18px "Plus Jakarta Sans"';
      ctx.fillStyle = '#666';
      ctx.fillText("BITS Pilani • Pro Dancer", 0, 95);
      ctx.restore();

      // Card 2: Right
      const card2X = w * 0.74 - miniW/2;
      const card2Y = h * 0.28;
      drawNeoCard(card2X, card2Y, miniW, miniH, '#FFFFFF', 28, '#251436', 8);

      ctx.save();
      ctx.translate(card2X + miniW/2, card2Y + 70);
      ctx.font = '54px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText("🕺", 0, 0);
      ctx.font = '900 26px "Plus Jakarta Sans"';
      ctx.fillStyle = '#251436';
      ctx.fillText("Rohan", 0, 60);
      ctx.font = '700 18px "Plus Jakarta Sans"';
      ctx.fillStyle = '#666';
      ctx.fillText("BITS Pilani • High Energy", 0, 95);
      ctx.restore();

      // Compatibility Meter in Center
      const percent = Math.min(98, Math.floor(relT * 35 + 40));
      drawBadge(`⚡ ${percent}% MATCH HARMONY`, centerX, h * 0.68, '#FFC928', '#251436', 0);

      ctx.font = '800 26px "Plus Jakarta Sans"';
      ctx.fillStyle = '#E3E0F5';
      ctx.fillText("Syncing Music, Footwork & Vibe...", centerX, h * 0.75);

      ctx.restore();
    }

    // --- BEAT 4: THE SILK-STRING CONNECTION (10.4s - 14.2s) ---
    function renderBeat4(w, h, t) {
      const relT = t - 10.4;
      const flow = relT / 3.8;

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#F02A8A';
      ctx.font = '800 32px "Plus Jakarta Sans"';
      ctx.fillText("THE SACRED THREAD", w/2, h * 0.12);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 52px "Plus Jakarta Sans"';
      ctx.fillText("Two Hearts. One String.", w/2, h * 0.16);

      // Two glowing node anchors
      const p1X = w * 0.2;
      const p1Y = h * 0.48;
      const p2X = w * 0.8;
      const p2Y = h * 0.48;

      // Glow Node 1
      ctx.save();
      ctx.beginPath();
      ctx.arc(p1X, p1Y, 45, 0, Math.PI * 2);
      ctx.fillStyle = '#894EFF';
      ctx.shadowColor = '#894EFF';
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = '40px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("💃", p1X, p1Y);
      ctx.restore();

      // Glow Node 2
      ctx.save();
      ctx.beginPath();
      ctx.arc(p2X, p2Y, 45, 0, Math.PI * 2);
      ctx.fillStyle = '#F02A8A';
      ctx.shadowColor = '#F02A8A';
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = '40px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("🕺", p2X, p2Y);
      ctx.restore();

      // Fluid Animated Silk String (Glowing Bezier curves)
      ctx.save();
      const waveOffset1 = Math.sin(t * 5) * 80;
      const waveOffset2 = Math.cos(t * 4) * 90;

      // Outer hot magenta silk neon glow
      ctx.beginPath();
      ctx.moveTo(p1X, p1Y);
      ctx.bezierCurveTo(w * 0.35, p1Y + waveOffset1, w * 0.65, p2Y - waveOffset2, p2X, p2Y);
      ctx.strokeStyle = '#F02A8A';
      ctx.shadowColor = '#F02A8A';
      ctx.shadowBlur = 35;
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Inner golden glowing core
      ctx.beginPath();
      ctx.moveTo(p1X, p1Y);
      ctx.bezierCurveTo(w * 0.35, p1Y + waveOffset1, w * 0.65, p2Y - waveOffset2, p2X, p2Y);
      ctx.strokeStyle = '#FFC928';
      ctx.shadowColor = '#FFC928';
      ctx.shadowBlur = 15;
      ctx.lineWidth = 6;
      ctx.stroke();

      // Traveling Spark along the silk string
      const travelU = (relT * 0.8) % 1.0;
      const sparkX = (1-travelU)*(1-travelU)*(1-travelU)*p1X + 3*(1-travelU)*(1-travelU)*travelU*(w*0.35) + 3*(1-travelU)*travelU*travelU*(w*0.65) + travelU*travelU*travelU*p2X;
      const sparkY = (1-travelU)*(1-travelU)*(1-travelU)*p1Y + 3*(1-travelU)*(1-travelU)*travelU*(p1Y + waveOffset1) + 3*(1-travelU)*travelU*travelU*(p2Y - waveOffset2) + travelU*travelU*travelU*p2Y;

      ctx.beginPath();
      ctx.arc(sparkX, sparkY, 14, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = '#FFFFFF';
      ctx.shadowBlur = 30;
      ctx.fill();

      ctx.restore();

      // Atmospheric caption
      drawBadge("🧵 THE RED THREAD OF FATE", w/2, h * 0.72, '#FFC928', '#251436', 0.02 * Math.sin(t * 3));
      ctx.font = '700 26px "Plus Jakarta Sans"';
      ctx.fillStyle = '#D4CEEF';
      ctx.fillText("An exclusive pairing, locked until Midnight", w/2, h * 0.78);

      ctx.restore();
    }

    // --- BEAT 5: THE COUNTDOWN ANTICIPATION (14.2s - 17.0s) ---
    function renderBeat5(w, h, t) {
      const relT = t - 14.2;
      const secondsLeft = Math.max(1, 3 - Math.floor(relT * 1.1));
      const pulse = 1 + 0.12 * Math.sin(t * 16); // Rapid tense heartbeat pulse

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFC928';
      ctx.font = '800 32px "Plus Jakarta Sans"';
      ctx.fillText("🔒 LOCKED COUNTDOWN", w/2, h * 0.14);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 52px "Plus Jakarta Sans"';
      ctx.fillText("Partner Reveal In...", w/2, h * 0.18);

      // Central Pulsing Clock Ring
      const centerX = w/2;
      const centerY = h * 0.48;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.scale(pulse, pulse);

      // Huge Glowing Dial
      const dialGrad = ctx.createRadialGradient(0, 0, 80, 0, 0, 240);
      dialGrad.addColorStop(0, 'rgba(240, 42, 138, 0.4)');
      dialGrad.addColorStop(0.7, 'rgba(137, 78, 255, 0.2)');
      dialGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = dialGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 240, 0, Math.PI * 2);
      ctx.fill();

      // Outer Dial Circle
      ctx.beginPath();
      ctx.arc(0, 0, 180, 0, Math.PI * 2);
      ctx.strokeStyle = '#FFC928';
      ctx.lineWidth = 8;
      ctx.shadowColor = '#FFC928';
      ctx.shadowBlur = 25;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Big Glowing Number
      ctx.font = '900 140px "Plus Jakarta Sans"';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`0${secondsLeft}`, 0, -10);

      ctx.font = '800 24px "Plus Jakarta Sans"';
      ctx.fillStyle = '#FFC928';
      ctx.fillText("SECONDS", 0, 75);

      ctx.restore();

      // Tension subtext
      drawBadge("⚡ MIDNIGHT GARBA PAIRING", w/2, h * 0.74, '#F02A8A', '#FFFFFF', -0.03);
      ctx.font = '700 26px "Plus Jakarta Sans"';
      ctx.fillStyle = '#E3E0F5';
      ctx.fillText("Get your dandiyas ready...", w/2, h * 0.80);

      ctx.restore();
    }

    // --- BEAT 6: PARTNER REVEAL & FINAL HERO MOMENT (17.0s - 20.0s) ---
    function renderBeat6(w, h, t) {
      const relT = t - 17.0;

      // Confetti Rain
      confettiPieces.forEach(c => {
        c.y += c.vy;
        c.x += c.vx;
        c.rotation += c.vRot;
        if (c.y > h) c.y = -50;

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate((c.rotation * Math.PI) / 180);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
        ctx.restore();
      });

      if (relT < 1.6) {
        // Phase A: The Reveal Match Card Pop
        const popScale = Math.min(1, relT * 3);

        ctx.save();
        ctx.translate(w/2, h * 0.46);
        ctx.scale(popScale, popScale);

        const matchCardW = isLandscape ? 560 : 740;
        const matchCardH = isLandscape ? 500 : 760;

        drawNeoCard(-matchCardW/2, -matchCardH/2, matchCardW, matchCardH, '#E3E0F5', 36, '#251436', 14);

        drawBadge("🎉 THE STRING HAS CONNECTED!", 0, -matchCardH/2 + 25, '#FFC928', '#251436', 0);

        // Matched Pair Photo Mock
        ctx.fillStyle = '#251436';
        ctx.beginPath();
        ctx.roundRect(-matchCardW * 0.42, -matchCardH/2 + 70, matchCardW * 0.84, 300, 24);
        ctx.fill();

        ctx.font = '80px "Plus Jakarta Sans"';
        ctx.textAlign = 'center';
        ctx.fillText("💃  🧵  🕺", 0, -matchCardH/2 + 220);

        ctx.font = '900 36px "Plus Jakarta Sans"';
        ctx.fillStyle = '#251436';
        ctx.fillText("Meet Rohan & Aanya", 0, 110);

        drawBadge("🔥 98% Compatibility Match", 0, 160, '#F02A8A', '#FFFFFF', 0);

        ctx.font = '700 22px "Plus Jakarta Sans"';
        ctx.fillStyle = '#251436';
        ctx.fillText("Matched for Tonight's Garba Circle 🪩", 0, 220);

        ctx.restore();
      } else {
        // Phase B: Final Hero Moment (18.6s - 20.0s)
        const heroEntrance = Math.min(1, (relT - 1.6) * 3);

        ctx.save();
        ctx.translate(w/2, h * 0.44);
        ctx.scale(heroEntrance, heroEntrance);

        // Huge Hero StringX Logo
        drawStringXLogo(0, -60, isLandscape ? 1.6 : 1.8, true);

        // Dandiya Sticks Crossed
        ctx.save();
        ctx.translate(0, 80);
        ctx.rotate(-0.3);
        ctx.fillStyle = '#894EFF';
        ctx.fillRect(-12, -70, 24, 140);
        ctx.fillStyle = '#FFC928';
        ctx.fillRect(-12, -30, 24, 20);
        ctx.rotate(0.6);
        ctx.fillStyle = '#F02A8A';
        ctx.fillRect(-12, -70, 24, 140);
        ctx.fillStyle = '#08A98D';
        ctx.fillRect(-12, -30, 24, 20);
        ctx.restore();

        // Tagline & URL CTA
        drawBadge("FIND YOUR GARBA PERSON", 0, 200, '#FFC928', '#251436', 0);

        ctx.font = '900 42px "Plus Jakarta Sans"';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.fillText("stringx.app", 0, 275);

        ctx.font = '700 24px "Plus Jakarta Sans"';
        ctx.fillStyle = '#D4CEEF';
        ctx.fillText("Available for Campus Navratri 2026", 0, 320);

        ctx.restore();
      }
    }

    // Main Render Loop
    function render(t) {
      const w = canvas.width;
      const h = canvas.height;

      // 1. Draw festive background
      drawBackground(w, h, t);

      // 2. Render Scene based on time
      if (t < 3.2) {
        renderBeat1(w, h, t);
      } else if (t < 6.8) {
        renderBeat2(w, h, t);
      } else if (t < 10.4) {
        renderBeat3(w, h, t);
      } else if (t < 14.2) {
        renderBeat4(w, h, t);
      } else if (t < 17.0) {
        renderBeat5(w, h, t);
      } else {
        renderBeat6(w, h, t);
      }
    }

    function loop(now) {
      if (!isPlaying) return;
      const delta = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      currentTime += delta;
      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        isPlaying = false;
        playIcon.innerText = '▶';
        playText.innerText = 'Play';
      }

      processAudioBeats(currentTime);
      render(currentTime);
      updateUI();

      if (isPlaying) {
        requestAnimationFrame(loop);
      }
    }

    // Direct Video Export using MediaRecorder
    function recordVideo() {
      const recordBtn = document.getElementById('recordBtn');
      if (isRecording) return;

      isRecording = true;
      recordBtn.innerText = '⏳ Rendering...';
      recordBtn.style.background = '#894EFF';
      recordedChunks = [];

      currentTime = 0.0;
      isPlaying = false;

      const stream = canvas.captureStream(30); // 30 FPS recording
      const options = { mimeType: 'video/webm;codecs=vp9' };
      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'StringX_Launch_Video_20s.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        isRecording = false;
        recordBtn.innerText = '📥 Export Video';
        recordBtn.style.background = '#FFC928';
      };

      mediaRecorder.start();
      togglePlay();

      const checkFinish = setInterval(() => {
        if (currentTime >= TOTAL_DURATION) {
          clearInterval(checkFinish);
          mediaRecorder.stop();
        }
      }, 200);
    }

    // Initial render frame 0
    render(0.0);
    updateUI();
  </script>
